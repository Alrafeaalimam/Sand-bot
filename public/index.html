<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>سند — بوت التوعية من مخاطر المخدرات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b1210;
    --panel: #101a17;
    --panel-2: #14201c;
    --line: #1f302a;
    --beacon: #d99a3d;
    --beacon-dim: #8a6a34;
    --signal: #4fae8f;
    --text: #e6ede9;
    --text-dim: #8fa39c;
    --danger: #c96b5a;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans Arabic', sans-serif;
  }

  body {
    background-image:
      radial-gradient(circle at 15% 8%, rgba(217,154,61,0.06), transparent 40%),
      radial-gradient(circle at 85% 92%, rgba(79,174,143,0.05), transparent 40%);
  }

  .shell {
    max-width: 760px;
    margin: 0 auto;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    border-inline: 1px solid var(--line);
    background: var(--panel);
  }

  /* ===== الهيدر: شريط إشارة/منارة ===== */
  .header {
    padding: 18px 22px 16px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    position: relative;
    overflow: hidden;
  }

  .header::before {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      90deg,
      transparent,
      transparent 38px,
      rgba(217,154,61,0.035) 38px,
      rgba(217,154,61,0.035) 39px
    );
    pointer-events: none;
  }

  .brand-row {
    display: flex;
    align-items: center;
    gap: 12px;
    position: relative;
  }

  .beacon-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--beacon);
    box-shadow: 0 0 0 0 rgba(217,154,61,0.6);
    animation: pulse 2.4s infinite;
    flex-shrink: 0;
  }

  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(217,154,61,0.55); }
    70% { box-shadow: 0 0 0 9px rgba(217,154,61,0); }
    100% { box-shadow: 0 0 0 0 rgba(217,154,61,0); }
  }

  .brand-name {
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: var(--text);
  }

  .brand-sub {
    font-size: 12.5px;
    color: var(--text-dim);
    margin-top: 4px;
    font-family: 'JetBrains Mono', monospace;
  }

  .status-line {
    margin-top: 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    color: var(--signal);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .status-line .mode-tag {
    padding: 2px 8px;
    border: 1px solid var(--line);
    border-radius: 3px;
    color: var(--text-dim);
  }

  /* ===== منطقة الرسائل ===== */
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .msg {
    max-width: 82%;
    padding: 12px 15px;
    border-radius: 10px;
    line-height: 1.75;
    font-size: 14.5px;
    white-space: pre-wrap;
    animation: rise 0.25s ease;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.bot {
    align-self: flex-start;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-inline-start: 3px solid var(--signal);
  }

  .msg.user {
    align-self: flex-end;
    background: rgba(217,154,61,0.1);
    border: 1px solid rgba(217,154,61,0.25);
    border-inline-end: 3px solid var(--beacon);
  }

  .msg.system {
    align-self: center;
    background: transparent;
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    border: 1px dashed var(--line);
  }

  .quick-replies {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    padding: 8px 20px 14px;
    background: linear-gradient(180deg, transparent, rgba(16, 26, 23, 0.6));
    max-height: 200px;
    overflow-y: auto;
  }

  .qr-btn {
    font-family: 'IBM Plex Sans Arabic', sans-serif;
    font-size: 13.5px;
    font-weight: 500;
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 8px 15px;
    border-radius: 22px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
    transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
    user-select: none;
  }

  .qr-btn:hover {
    border-color: var(--signal);
    color: #ffffff;
    background: rgba(79, 174, 143, 0.15);
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(79, 174, 143, 0.2);
  }

  .qr-btn:active {
    transform: scale(0.96);
  }

  .qr-btn.accent {
    border-color: rgba(217, 154, 61, 0.45);
    background: rgba(217, 154, 61, 0.1);
    color: #f7e6cc;
  }

  .qr-btn.accent:hover {
    border-color: var(--beacon);
    color: #ffffff;
    background: rgba(217, 154, 61, 0.25);
    box-shadow: 0 4px 14px rgba(217, 154, 61, 0.3);
  }

  .qr-btn.nav {
    border-color: rgba(201, 107, 90, 0.3);
    color: var(--text-dim);
  }

  .qr-btn.nav:hover {
    border-color: var(--danger);
    color: #ffb4a6;
    background: rgba(201, 107, 90, 0.15);
  }

  .typing {
    align-self: flex-start;
    display: flex;
    gap: 5px;
    padding: 12px 15px;
  }

  .typing span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text-dim);
    animation: blink 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes blink {
    0%, 80%, 100% { opacity: 0.25; }
    40% { opacity: 1; }
  }

  /* ===== شريط الإدخال ===== */
  .composer {
    border-top: 1px solid var(--line);
    background: var(--panel-2);
    padding: 14px 16px;
    display: flex;
    gap: 10px;
  }

  .composer input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 12px 14px;
    border-radius: 8px;
    font-family: 'IBM Plex Sans Arabic', sans-serif;
    font-size: 14.5px;
    outline: none;
  }

  .composer input:focus {
    border-color: var(--signal);
  }

  .composer button {
    background: var(--beacon);
    color: #14100a;
    border: none;
    padding: 0 18px;
    border-radius: 8px;
    font-weight: 700;
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    transition: opacity 0.15s;
  }

  .composer button:hover { opacity: 0.85; }
  .composer button:disabled { opacity: 0.4; cursor: not-allowed; }

  .footer-note {
    text-align: center;
    font-size: 10.5px;
    color: var(--text-dim);
    padding: 8px 10px 12px;
    font-family: 'JetBrains Mono', monospace;
  }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
</style>
</head>
<body>

<div class="shell">
  <div class="header">
    <div class="brand-row">
      <div class="beacon-dot"></div>
      <div>
        <div class="brand-name">سَنَد</div>
        <div class="brand-sub">منارة توعية من مخاطر المخدرات — السودان</div>
      </div>
    </div>
    <div class="status-line">
      <span>◈ متصل</span>
      <span class="mode-tag" id="modeTag">القائمة الرئيسية</span>
    </div>
  </div>

  <div class="messages" id="messages"></div>
  <div class="quick-replies" id="quickReplies"></div>

  <div class="composer">
    <input id="input" type="text" placeholder="اكتب رسالتك هنا…" autocomplete="off" />
    <button id="sendBtn">إرسال</button>
  </div>
  <div class="footer-note">سرية تامة · بلا حكم · اكتب "مساعدة" لجهات العلاج في أي وقت</div>
</div>

<script>
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const quickRepliesEl = document.getElementById('quickReplies');
const modeTag = document.getElementById('modeTag');

let sessionId = localStorage.getItem('sanad_session');

async function initSession() {
  if (!sessionId) {
    const res = await fetch('/api/session');
    const data = await res.json();
    sessionId = data.sessionId;
    localStorage.setItem('sanad_session', sessionId);
  }
  sendToBot('قايمة', true);
}

function formatMarkdown(text) {
  if (!text) return '';
  let safe = text
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
  safe = safe.replace(/\*([^*]+)\*/g, '<strong>$1</strong>');
  return safe;
}

function addMessage(text, sender) {
  const el = document.createElement('div');
  el.className = 'msg ' + sender;
  if (sender === 'bot') {
    el.innerHTML = formatMarkdown(text);
  } else {
    el.textContent = text;
  }
  messagesEl.appendChild(el);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function showTyping() {
  const el = document.createElement('div');
  el.className = 'typing';
  el.id = 'typingIndicator';
  el.innerHTML = '<span></span><span></span><span></span>';
  messagesEl.appendChild(el);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function hideTyping() {
  const el = document.getElementById('typingIndicator');
  if (el) el.remove();
}

function updateModeTag(userText) {
  const norm = (userText || '').trim();
  if (['1'].includes(norm) || norm.includes('خبير')) modeTag.textContent = 'الخبير المجهول';
  else if (['2'].includes(norm) || norm.includes('لعبة')) modeTag.textContent = 'لعبة القرار';
  else if (['3'].includes(norm) || norm.includes('مساعدة') || norm.includes('علاج')) modeTag.textContent = 'جهات المساعدة';
  else if (['قايمة','menu','0','الرئيسية','قائمة'].some(k => norm.toLowerCase().includes(k))) modeTag.textContent = 'القائمة الرئيسية';
}

function renderQuickReplies(botText) {
  quickRepliesEl.innerHTML = '';
  if (!botText) return;

  const lines = botText.split('\n');
  const buttons = [];

  const isWelcome = botText.includes('أهلاً بيك في *سند*') || botText.includes('اختار شنو داير تعمل');
  const isGameMenu = botText.includes('لعبة القرار — اختار موقف');
  const isExpertIntro = botText.includes('وضع الخبير المجهول');
  const isHelpContacts = botText.includes('جهات مساعدة وعلاج');

  if (isWelcome) {
    buttons.push({ text: '1️⃣ 🕵️ اسأل الخبير المجهول', value: '1', accent: true });
    buttons.push({ text: '2️⃣ 🎮 لعبة القرار (سيناريوهات)', value: '2', accent: true });
    buttons.push({ text: '3️⃣ 📞 جهات مساعدة وعلاج', value: '3', accent: false });
    buttons.push({ text: '0️⃣ 🏠 الرئيسية', value: '0', nav: true });
  } else if (isGameMenu) {
    lines.forEach(l => {
      const trimmed = l.trim();
      const match = trimmed.match(/^([1-9])(?:\uFE0F?\u20E3|\.|\))\s*(.+)$/);
      if (match) {
        buttons.push({ text: trimmed, value: match[1], accent: true });
      }
    });
    buttons.push({ text: '↩ القائمة الرئيسية', value: 'قايمة', nav: true });
  } else if (isExpertIntro) {
    buttons.push({ text: '❓ شنو هو مخدر الآيس؟', value: 'شنو هو مخدر الآيس؟', accent: true });
    buttons.push({ text: '🔍 علامات التعاطي شنو؟', value: 'كيف أعرف علامات تعاطي الآيس؟', accent: true });
    buttons.push({ text: '🤝 كيف أساعد زول مدمن؟', value: 'كيف أساعد شخص مدمن بدون ما أحرجه؟', accent: true });
    buttons.push({ text: '⚖️ القانون السوداني والمخدرات', value: 'شنو عقوبة المخدرات في القانون السوداني؟', accent: false });
    buttons.push({ text: '↩ رجوع للقائمة', value: 'قايمة', nav: true });
  } else if (isHelpContacts) {
    buttons.push({ text: '1️⃣ اسأل الخبير المجهول', value: '1', accent: true });
    buttons.push({ text: '2️⃣ لعبة القرار', value: '2', accent: true });
    buttons.push({ text: '↩ القائمة الرئيسية', value: 'قايمة', nav: true });
  } else {
    lines.forEach(l => {
      const trimmed = l.trim();
      const match = trimmed.match(/^([1-9])(?:\uFE0F?\u20E3|\.|\))\s*(.+)$/);
      if (match) {
        buttons.push({ text: trimmed, value: match[1], accent: true });
      }
    });

    if (botText.includes('الرجوع للقائمة') || botText.includes('قرار ممتاز') || botText.includes('التجاهل') || botText.includes('ابتعدت عنه')) {
      buttons.push({ text: '🎮 سيناريو جديد', value: '2', accent: true });
    }

    buttons.push({ text: '↩ قايمة', value: 'قايمة', nav: true });
  }

  buttons.forEach(b => {
    const btn = document.createElement('button');
    btn.className = 'qr-btn' + (b.accent ? ' accent' : '') + (b.nav ? ' nav' : '');
    btn.textContent = b.text;
    btn.onclick = () => sendToBot(b.value);
    quickRepliesEl.appendChild(btn);
  });

  quickRepliesEl.scrollTop = 0;
}

async function sendToBot(text, silent) {
  if (!silent) {
    addMessage(text, 'user');
    updateModeTag(text);
  }
  inputEl.value = '';
  sendBtn.disabled = true;
  showTyping();
  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sessionId, message: text })
    });
    const data = await res.json();
    hideTyping();
    if (data.reply) {
      addMessage(data.reply, 'bot');
      renderQuickReplies(data.reply);
    } else {
      addMessage('صار خطأ، حاول تاني.', 'system');
    }
  } catch (e) {
    hideTyping();
    addMessage('تعذر الاتصال بالسيرفر.', 'system');
  }
  sendBtn.disabled = false;
  inputEl.focus();
}

sendBtn.addEventListener('click', () => {
  const val = inputEl.value.trim();
  if (val) sendToBot(val);
});

inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const val = inputEl.value.trim();
    if (val) sendToBot(val);
  }
});

initSession();
</script>
</body>
</html>
